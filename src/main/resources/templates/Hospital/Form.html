<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Adauga Spital</title></head>
<body>
<h1>Adauga un spital nou</h1>
<form th:action="@{/hospital}" th:object="${hospital}" method="post">
    <label>ID Spital:</label>
    <input type="text" th:field="*{id}" required/><br><br>

    <label>Nume Spital:</label>
    <input type="text" th:field="*{name}" required/><br><br>

    <label>Oras:</label>
    <input type="text" th:field="*{city}"/><br><br>

    <label>Linie Urgenta (Emergency Hotline):</label>
    <input type="text" th:field="*{emergencyHotline}"/><br><br>

    <button type="submit">Salveaza</button>
</form>
<br><a th:href="@{/hospital}">Inapoi la lista</a>
</body>
</html>
