<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Hospital Form</title>
</head>
<body>
<h1>Add/Edit Hospital</h1>
<form th:action="@{/hospital}" th:object="${hospital}" method="post">
    <label>Hospital ID:</label>
    <input type="text" th:field="*{id}" placeholder="Leave blank for auto-generation"/><br><br>

    <label>Hospital Name:</label>
    <input type="text" th:field="*{name}" required/><br><br>

    <label>City:</label>
    <input type="text" th:field="*{city}"/><br><br>

    <label>Emergency Hotline:</label>
    <input type="text" th:field="*{emergencyHotline}"/><br><br>

    <button type="submit">Save</button>
</form>
<br><a th:href="@{/hospital}">Back to list</a>
</body>
</html>
