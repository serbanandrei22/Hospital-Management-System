<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Hospitals List</title>
</head>
<body>
<h1>All Hospitals</h1>
<a th:href="@{/hospital/new}">Add a New Hospital</a>
<br><br>
<table border="1">
    <thead>
    <tr>
        <th>Hospital ID</th>
        <th>Hospital Name</th>
        <th>City</th>
        <th>Emergency Hotline</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="h : ${hospitals}">
        <td th:text="${h.id}"></td>
        <td th:text="${h.name}"></td>
        <td th:text="${h.city}"></td>
        <td th:text="${h.emergencyHotline}"></td>
        <td>
            <form th:action="@{'/hospital/' + ${h.id} + '/delete'}" method="post" style="display:inline;">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
