<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Add Room</title></head>
<body>
<h1>Add a New Room</h1>
<form th:action="@{/room}" th:object="${room}" method="post">
    <label>Room ID:</label>
    <input type="text" th:field="*{id}" placeholder="Leave blank for auto-generation"/><br><br>

    <label>Room Number:</label>
    <input type="text" th:field="*{number}" required/><br><br>

    <label>Hospital ID:</label>
    <input type="text" th:field="*{hospitalId}"/><br><br>

    <label>Floor Number:</label>
    <input type="number" th:field="*{floorNumber}"/><br><br>

    <label>Capacity:</label>
    <input type="number" step="any" th:field="*{capacity}"/><br><br>

    <label>Status:</label>
    <select th:field="*{status}">
        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
    </select><br><br>

    <button type="submit">Save</button>
</form>
<br><a th:href="@{/room}">Back to list</a>
</body>
</html>
