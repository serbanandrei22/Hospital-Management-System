<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Rooms List</title></head>
<body>
<h1>All Rooms</h1>
<a th:href="@{/room/new}">Add a New Room</a>
<br><br>
<table border="1">
    <thead>
    <tr>
        <th>Room ID</th>
        <th>Number</th>
        <th>Hospital ID</th>
        <th>Floor</th>
        <th>Capacity</th>
        <th>Status</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="r : ${rooms}">
        <td th:text="${r.id}"></td>
        <td th:text="${r.number}"></td>
        <td th:text="${r.hospitalId}"></td>
        <td th:text="${r.floorNumber}"></td>
        <td th:text="${r.capacity}"></td>
        <td th:text="${r.status}"></td>
        <td>
            <form th:action="@{'/room/' + ${r.id} + '/delete'}" method="post" style="display:inline;">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
