<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Adauga Asistent</title></head>
<body>
<h1>Adauga un asistent nou</h1>
<form th:action="@{/nurse}" th:object="${nurse}" method="post">

    <label>ID Asistent:</label>
    <input type="text" th:field="*{id}" required/><br><br>

    <label>Nume Asistent(a):</label>
    <input type="text" th:field="*{name}" required/><br><br>

    <label>ID Departament:</label>
    <input type="text" th:field="*{departmentId}"/><br><br>

    <label>Status:</label>
    <select th:field="*{qualificationLevel}">
        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
    </select><br><br>

    <button type="submit">Salveaza</button>
</form>
<br><a th:href="@{/nurse}">Inapoi la lista</a>
</body>
</html>
