<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Nurse Form</title>
</head>
<body>
<h1>Add/Edit Nurse</h1>
<div th:if="${errorMessage}" th:text="${errorMessage}" style="color: red; font-weight: bold; margin-bottom: 15px;"></div>
<form th:action="@{/nurse}" th:object="${nurse}" method="post">

    <label>Nurse ID:</label>
    <input type="text" th:field="*{id}" placeholder="Leave blank for auto-generation"/><br><br>

    <label>Nurse Name:</label>
    <input type="text" th:field="*{name}" required/><br><br>

    <label>Department ID:</label>
    <input type="text" th:field="*{departmentId}"/><br><br>

    <label>Qualification Level:</label>
    <select th:field="*{qualificationLevel}">
        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
    </select><br><br>

    <button type="submit">Save</button>
</form>
<br><a th:href="@{/nurse}">Back to list</a>
</body>
</html>
