<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Nurses List</title>
</head>
<body>
<h1>All Nurses</h1>
<a th:href="@{/nurse/new}">Add a New Nurse</a>
<br><br>
<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Department ID</th>
        <th>Qualification Level</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="n : ${nurses}">
        <td th:text="${n.id}"></td>
        <td th:text="${n.name}"></td>
        <td th:text="${n.departmentId}"></td>
        <td th:text="${n.qualificationLevel}"></td>
        <td>
            <form th:action="@{'/nurse/' + ${n.id} + '/delete'}" method="post" style="display:inline;">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
