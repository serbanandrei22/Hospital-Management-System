<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Department</title>
</head>
<body>
<h1>Add a New Department</h1>
<form th:action="@{/department}" th:object="${department}" method="post">

    <label>Department ID:</label>
    <input type="text" th:field="*{id}" placeholder="Leave blank for auto-generation"/><br><br>

    <label>Department Name:</label>
    <input type="text" th:field="*{name}" required/><br><br>

    <label>Hospital ID:</label>
    <input type="text" th:field="*{hospitalId}"/><br><br>

    <button type="submit">Save</button>
</form>
<br><a th:href="@{/department}">Back to list</a>
</body>
</html>
