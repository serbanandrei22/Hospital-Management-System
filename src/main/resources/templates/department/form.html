<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Adauga Departament</title></head>
<body>
<h1>Adauga un departament nou</h1>
<form th:action="@{/department}" th:object="${department}" method="post">

    <label>ID Departament:</label>
    <input type="text" th:field="*{id}" required/><br><br>

    <label>Nume Departament:</label>
    <input type="text" th:field="*{name}" required/><br><br>

    <label>ID Spital:</label>
    <input type="text" th:field="*{hospitalId}"/><br><br>

    <button type="submit">Salveaza</button>
</form>
<br><a th:href="@{/department}">Inapoi la lista</a>
</body>
</html>
