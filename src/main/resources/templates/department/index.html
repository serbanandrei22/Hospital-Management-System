<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Departments List</title>
</head>
<body>
<h1>All Departments</h1>
<a th:href="@{/department/new}">Add a New Department</a>
<br><br>
<table border="1">
    <thead>
    <tr>
        <th>Department ID</th>
        <th>Name</th>
        <th>Hospital ID</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="dep : ${departments}">
        <td th:text="${dep.id}"></td>
        <td th:text="${dep.name}"></td>
        <td th:text="${dep.hospitalId}"></td>
        <td>
            <form th:action="@{'/department/' + ${dep.id} + '/delete'}" method="post" style="display:inline;">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
