<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Doctors List</title>
</head>
<body>
<h1>All Doctors</h1>
<a th:href="@{/doctor/new}">Add a New Doctor</a>
<br><br>
<table border="1">
    <thead>
    <tr>
        <th>Doctor ID</th>
        <th>Doctor Name</th>
        <th>Department ID</th>
        <th>License Number</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="d : ${doctors}">
        <td th:text="${d.id}"></td>
        <td th:text="${d.name}"></td>
        <td th:text="${d.departmentId}"></td>
        <td th:text="${d.licenseNumber}"></td>
        <td>
            <form th:action="@{'/doctor/' + ${d.id} + '/delete'}" method="post" style="display:inline;">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
