<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Doctor Details</title>
</head>
<body>
<h1>Doctor Details</h1>

<div>
    <p><strong>Doctor ID:</strong> <span th:text="${doctor.id}"></span></p>
    <p><strong>Doctor Name:</strong> <span th:text="${doctor.name}"></span></p>
    <p><strong>Department ID:</strong> <span th:text="${doctor.departmentId}"></span></p>
    <p><strong>License Number:</strong> <span th:text="${doctor.licenseNumber}"></span></p>
</div>

<br>
<a th:href="@{/doctor/{id}/edit(id=${doctor.id})}">Edit</a> |
<a th:href="@{/doctor}">Back to List</a>
</body>
</html>>
