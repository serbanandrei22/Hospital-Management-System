<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Patient Form</title>
</head>
<body>
<h1>Add/Edit Patient</h1>

<form th:action="@{/patient}" th:object="${patient}" method="post">

    <label>Patient ID:</label>
    <input type="text" th:field="*{id}" placeholder="Leave blank for auto-generation"/><br><br>

    <label>Patient Name:</label>
    <input type="text" th:field="*{name}" required/><br><br>

    <label>Email:</label>
    <input type="email" th:field="*{email}"/><br><br>

    <label>Phone Number:</label>
    <input type="text" th:field="*{phoneNumber}"/><br><br>

    <label>Appointment IDs (comma-separated):</label>
    <input type="text" th:field="*{appointments}" placeholder="e.g. app1, app2"/><br><br>

    <button type="submit">Save</button>
</form>

<br>
<a th:href="@{/patient}">Back to list</a>
</body>
</html>
