<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Adauga Pacient</title>
</head>
<body>
<h1>Adauga un pacient nou</h1>

<form th:action="@{/patient}" th:object="${patient}" method="post">

    <label>ID Pacient:</label>
    <input type="text" th:field="*{id}" required/><br><br>

    <label>Nume Pacient:</label>
    <input type="text" th:field="*{name}" required/><br><br>

    <label>Email:</label>
    <input type="email" th:field="*{email}"/><br><br>

    <label>Telefon:</label>
    <input type="text" th:field="*{phoneNumber}"/><br><br>

    <label>ID-uri Programări (separate prin virgulă):</label>
    <input type="text" th:field="*{appointments}" placeholder="ex: prog1, prog2"/><br><br>

    <button type="submit">Salvează</button>
</form>

<br>
<a th:href="@{/patient}">Înapoi la listă</a>
</body>
</html>
