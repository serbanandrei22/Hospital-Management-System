<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Patients List</title>
</head>
<body>
<h1>All Patients</h1>

<a th:href="@{/patient/new}">Add a New Patient</a>
<br><br>

<table border="1">
    <thead>
    <tr>
        <th>Patient ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Phone Number</th>
        <th>Appointments</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="p : ${patients}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.name}"></td>
        <td th:text="${p.email}"></td>
        <td th:text="${p.phoneNumber}"></td>
        <td th:text="${p.appointments}"></td>
        <td>
            <a th:href="@{/patient/{id}(id=${p.id})}">Details</a> |
            <a th:href="@{/patient/{id}/edit(id=${p.id})}">Edit</a> |
            <form th:action="@{'/patient/' + ${p.id} + '/delete'}" method="post" style="display:inline;">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
