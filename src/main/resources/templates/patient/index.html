<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista Pacienti</title>
</head>
<body>
<h1>Toti Pacientii</h1>

<a th:href="@{/patient/new}">Adauga un pacient nou</a>
<br><br>

<table border="1">
    <thead>
    <tr>
        <th>ID Pacient</th>
        <th>Nume</th>
        <th>Email</th>
        <th>Telefon</th>
        <th>Programari</th>
        <th>Actiuni</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="p : ${patients}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.name}"></td>
        <td th:text="${p.email}"></td>
        <td th:text="${p.phoneNumber}"></td>
        <td th:text="${p.appointments}"></td>
        <td>
            <form th:action="@{'/patient/' + ${p.id} + '/delete'}" method="post" style="display:inline;">
            <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
