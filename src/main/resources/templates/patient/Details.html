<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Patient Details</title>
</head>
<body>
<h1>Patient Details</h1>

<div>
    <p><strong>Patient ID:</strong> <span th:text="${patient.id}"></span></p>
    <p><strong>Name:</strong> <span th:text="${patient.name}"></span></p>
    <p><strong>Email:</strong> <span th:text="${patient.email}"></span></p>
    <p><strong>Phone Number:</strong> <span th:text="${patient.phoneNumber}"></span></p>
    <p><strong>Appointments:</strong> <span th:text="${patient.appointments}"></span></p>
</div>

<br>
<a th:href="@{/patient/{id}/edit(id=${patient.id})}">Edit</a> |
<a th:href="@{/patient}">Back to List</a>
</body>
</html>
