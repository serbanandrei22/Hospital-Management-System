<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Adaugă Programare</title></head>
<body>
<h1>Adaugă o programare nouă</h1>
<form th:action="@{/appointment}" th:object="${appointment}" method="post">

    <label>ID Programare:</label>
    <input type="text" th:field="*{id}" required/><br><br>

    <label>ID Pacient:</label>
    <input type="text" th:field="*{patientId}" required/><br><br>

    <label>ID Departament:</label>
    <input type="text" th:field="*{departmentId}"/><br><br>

    <label>Data Admiterii:</label>
    <input type="date" th:field="*{admissionDate}"/><br><br>

    <label>Status (scrie ACTIVE sau COMPLETED):</label>
    <input type="text" th:field="*{status}"/><br><br>

    <button type="submit">Salvează</button>
</form>
<br><a th:href="@{/appointment}">Înapoi la listă</a>
</body>
</html>
