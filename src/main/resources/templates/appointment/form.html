<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Appointment Form</title>
</head>
<body>
<h1>Add/Edit Appointment</h1>
<div th:if="${errorMessage}" th:text="${errorMessage}" style="color: red; font-weight: bold; margin-bottom: 15px;"></div>
<form th:action="@{/appointment}" th:object="${appointment}" method="post">

    <label>Appointment ID:</label>
    <input type="text" th:field="*{id}" placeholder="Leave blank for auto-generation"/><br><br>

    <label>Patient ID:</label>
    <input type="text" th:field="*{patientId}" required/><br><br>

    <label>Department ID:</label>
    <input type="text" th:field="*{departmentId}"/><br><br>

    <label>Admission Date:</label>
    <input type="date" th:field="*{admissionDate}"/><br><br>

    <label>Status:</label>
    <select th:field="*{status}">
        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
    </select><br><br>

    <button type="submit">Save</button>
</form>
<br><a th:href="@{/appointment}">Back to list</a>
</body>
</html>
